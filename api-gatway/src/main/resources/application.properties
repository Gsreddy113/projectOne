spring.application.name=api-gatway


eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
server.port=8089

spring.cloud.gateway.mvc.routes[0].id=orderService
spring.cloud.gateway.mvc.routes[0].uri=lb://orderService
#spring.cloud.gateway.mvc.routes[0].uri=http://localhost:8081
#uri is the serviceName which request to be routed and it resolvs by the eruka server
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/orders/**


